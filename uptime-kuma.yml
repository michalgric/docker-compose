services:
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
    volumes:
      - /service/docker/data/uptime-kuma:/app/data
    networks:
      - main_default

networks:
  main_default:
    external: true
